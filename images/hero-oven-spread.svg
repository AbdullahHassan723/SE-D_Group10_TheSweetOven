<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 380" width="520" height="380" role="img" aria-labelledby="heroIllusTitle">
  <title id="heroIllusTitle">Warm artisan bread, layered chocolate cake, and pastries from The Sweet Oven</title>
  <defs>
    <linearGradient id="warmGlow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FCE8EC"/>
      <stop offset="100%" stop-color="#FFF8EE"/>
    </linearGradient>
  </defs>

  <!-- Soft backdrop card -->
  <rect x="12" y="12" width="496" height="356" rx="28" fill="url(#warmGlow)" stroke="#DFCBB7" stroke-width="2"/>
  <circle cx="415" cy="86" r="56" fill="#F3B6C0" opacity="0.45"/>
  <circle cx="96" cy="290" r="44" fill="#F3B6C0" opacity="0.35"/>

  <!-- Wooden bakery counter -->
  <rect x="38" y="294" width="444" height="22" rx="11" fill="#4A2C1D"/>
  <rect x="52" y="286" width="416" height="10" rx="5" fill="#B5601E"/>

  <!-- Cake stand & signature chocolate fudge cake (center) -->
  <rect x="246" y="248" width="28" height="38" rx="4" fill="#4A2C1D"/>
  <ellipse cx="260" cy="284" rx="46" ry="8" fill="#4A2C1D"/>
  <ellipse cx="260" cy="248" rx="86" ry="13" fill="#FFFFFF" stroke="#4A2C1D" stroke-width="3"/>

  <!-- Cake body -->
  <rect x="192" y="168" width="136" height="78" rx="12" fill="#4A2C1D"/>
  <rect x="192" y="204" width="136" height="10" fill="#B5601E"/>
  <!-- Caramel/pink drip frosting -->
  <path d="M192 174 Q204 194 216 174 Q228 196 240 174 Q252 190 264 174 Q276 198 288 174 Q300 192 312 174 Q320 184 328 174 L328 158 Q260 144 192 158 Z" fill="#B5601E"/>
  <ellipse cx="260" cy="158" rx="68" ry="13" fill="#D47D39"/>
  <!-- Frosting swirls & berries -->
  <circle cx="230" cy="152" r="9" fill="#F3B6C0" stroke="#4A2C1D" stroke-width="2"/>
  <circle cx="260" cy="147" r="11" fill="#FFF8EE" stroke="#4A2C1D" stroke-width="2"/>
  <circle cx="290" cy="152" r="9" fill="#F3B6C0" stroke="#4A2C1D" stroke-width="2"/>
  <circle cx="260" cy="138" r="5" fill="#B5601E"/>

  <!-- Left: Red velvet cupcake -->
  <path d="M90 236 L102 286 L142 286 L154 236 Z" fill="#B5601E" stroke="#4A2C1D" stroke-width="2.5" stroke-linejoin="round"/>
  <line x1="110" y1="238" x2="114" y2="285" stroke="#4A2C1D" stroke-width="2"/>
  <line x1="134" y1="238" x2="130" y2="285" stroke="#4A2C1D" stroke-width="2"/>
  <path d="M84 236 Q122 200 160 236 Z" fill="#8A2B3B"/>
  <path d="M94 222 Q122 188 150 222 Q122 232 94 222 Z" fill="#FFF8EE" stroke="#4A2C1D" stroke-width="2.2"/>
  <path d="M106 205 Q122 182 138 205 Z" fill="#F3B6C0" stroke="#4A2C1D" stroke-width="2"/>

  <!-- Right: Croissant & Cinnamon Roll -->
  <ellipse cx="394" cy="264" rx="46" ry="22" fill="#D4843E" stroke="#4A2C1D" stroke-width="2.5"/>
  <path d="M364 264 Q394 244 424 264" fill="none" stroke="#4A2C1D" stroke-width="2.2"/>
  <path d="M376 250 Q394 238 412 250" fill="none" stroke="#FFF8EE" stroke-width="4" stroke-linecap="round"/>

  <!-- Rising steam / warm aroma curls -->
  <path d="M214 118 Q208 98 220 82 Q230 68 220 54" fill="none" stroke="#B5601E" stroke-width="3" stroke-linecap="round"/>
  <path d="M260 110 Q254 90 266 74 Q276 60 266 44" fill="none" stroke="#B5601E" stroke-width="3" stroke-linecap="round"/>
  <path d="M306 118 Q300 98 312 82 Q322 68 312 54" fill="none" stroke="#B5601E" stroke-width="3" stroke-linecap="round"/>

  <!-- Small decorative ribbon tag -->
  <rect x="64" y="54" width="128" height="34" rx="17" fill="#FFFFFF" stroke="#F3B6C0" stroke-width="2.5"/>
  <text x="128" y="76" text-anchor="middle" font-family="Georgia, serif" font-size="13" font-weight="700" fill="#4A2C1D">Baked Fresh Daily</text>
</svg>
