<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 280" width="320" height="280" role="img" aria-labelledby="chefHatTitle">
  <title id="chefHatTitle">Chef hat illustration for The Sweet Oven baker</title>
  <rect x="10" y="10" width="300" height="260" rx="24" fill="#FCE8EC" stroke="#DFCBB7" stroke-width="2"/>
  <circle cx="160" cy="140" r="96" fill="#FFF8EE" stroke="#F3B6C0" stroke-width="2.5"/>

  <!-- Chef hat puff -->
  <path d="M98 148
           C80 144, 72 118, 92 104
           C92 78, 124 68, 144 82
           C154 66, 184 68, 192 86
           C214 78, 236 98, 226 120
           C240 132, 232 150, 214 150 Z"
        fill="#FFFFFF" stroke="#4A2C1D" stroke-width="4" stroke-linejoin="round"/>

  <!-- Soft pleats inside chef hat -->
  <path d="M126 108 Q130 130 128 148" fill="none" stroke="#DFCBB7" stroke-width="3" stroke-linecap="round"/>
  <path d="M160 98 Q160 124 160 148" fill="none" stroke="#DFCBB7" stroke-width="3" stroke-linecap="round"/>
  <path d="M194 108 Q190 130 192 148" fill="none" stroke="#DFCBB7" stroke-width="3" stroke-linecap="round"/>

  <!-- Chef hat band -->
  <rect x="102" y="148" width="116" height="44" rx="8" fill="#FFF8EE" stroke="#4A2C1D" stroke-width="4"/>
  <rect x="104" y="176" width="112" height="14" rx="4" fill="#F3B6C0"/>
  <line x1="104" y1="176" x2="216" y2="176" stroke="#4A2C1D" stroke-width="2.5"/>

  <!-- Small whisk accent -->
  <circle cx="160" cy="162" r="6" fill="#B5601E"/>
  <text x="160" y="224" text-anchor="middle" font-family="Georgia, serif" font-size="14" font-weight="700" fill="#4A2C1D">Hira Salman &bull; Home Baker</text>
</svg>
